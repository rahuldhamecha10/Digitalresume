<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="50%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="200" cy="180" r="128" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Avatar Base Silhouette -->
  <g filter="url(#shadow)">
    <!-- Head -->
    <circle cx="200" cy="145" r="58" fill="url(#avatarGrad)" />
    <!-- Shoulders & Torso -->
    <path d="M100 295 C 100 225, 140 215, 200 215 C 260 215, 300 225, 300 295 Z" fill="url(#avatarGrad)" />
  </g>

  <!-- Face details subtle outline -->
  <circle cx="200" cy="142" r="50" fill="#60A5FA" opacity="0.25" />

  <!-- Photo replace badge -->
  <g transform="translate(100, 318)">
    <rect width="200" height="42" rx="21" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Camera Icon -->
    <g transform="translate(24, 12)" stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 15a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3l2-2h6l2 2h3a2 2 0 0 1 2 2z" transform="scale(0.8) translate(-1, -1)" />
      <circle cx="7.2" cy="7.2" r="2.8" />
    </g>
    <text x="56" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1E40AF">Profile Photo</text>
  </g>
</svg>

